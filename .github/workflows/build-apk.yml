name: Build MIDI Player APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/midi-player"
          cat > "$RUNNER_TEMP/project.b64" <<'PAYLOAD'
          
          PAYLOAD
          base64 -d "$RUNNER_TEMP/project.b64" > "$RUNNER_TEMP/project.zip"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/midi-player"

      - name: Build APK
        working-directory: ${{ runner.temp }}/midi-player
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Player-APK
          path: ${{ runner.temp }}/midi-player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
